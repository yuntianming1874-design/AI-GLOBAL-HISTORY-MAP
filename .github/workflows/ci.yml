name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality-gates:
    name: Quality Gates + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Validate seed
        run: npm run validate:seed

      - name: Audit history
        run: npm run audit:history

      - name: Test provenance
        run: npm run test:provenance

      - name: Test timeline interaction (jsdom)
        run: npm run test:interaction

      - name: Test journey
        run: npm run test:journey

      - name: Test narrative
        run: npm run test:narrative

      - name: Test lifespan
        run: npm run test:lifespan

      - name: Test world context
        run: npm run test:world

      - name: Test journey integration
        run: npm run test:journey-integration

      - name: Test review
        run: npm run test:review

      - name: Test complete
        run: npm run test:complete

      - name: Test featured journeys
        run: npm run test:featured

      - name: Test navigator
        run: npm run test:navigator

      - name: Test assistant-navigator integration
        run: npm run test:assistant-navigator

      - name: Test recommendations UI (jsdom)
        run: npm run test:recommendations-ui

      - name: Test OpenAI path (mock endpoint)
        run: npm run test:openai-path

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
